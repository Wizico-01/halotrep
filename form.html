<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Halogen Group — Sitrep Form</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f2f5; min-height: 100vh; }
  .header { background: #0D1B4B; color: #C8A84B; padding: 20px 20px 16px; text-align: center; }
  .header h1 { font-size: 18px; letter-spacing: 1px; font-weight: bold; }
  .header p { font-size: 12px; color: #bbb; margin-top: 4px; }
  .location-badge { background: #C8A84B; color: #0D1B4B; text-align: center; padding: 14px 20px; }
  .location-badge .loc { font-size: 20px; font-weight: bold; }
  .location-badge .meta { font-size: 12px; margin-top: 4px; opacity: 0.8; }
  .form-card { background: #fff; border-radius: 12px; margin: 20px 16px; padding: 24px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .form-card h2 { font-size: 15px; color: #0D1B4B; font-weight: bold; margin-bottom: 18px; border-bottom: 2px solid #C8A84B; padding-bottom: 8px; }
  .field { margin-bottom: 18px; }
  label { display: block; font-size: 13px; font-weight: bold; color: #444; margin-bottom: 6px; }
  input, select, textarea { width: 100%; padding: 12px 14px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; color: #222; background: #fafafa; }
  input:focus, select:focus, textarea:focus { outline: none; border-color: #C8A84B; background: #fff; }
  .num-row { display: flex; gap: 12px; }
  .num-row .field { flex: 1; }
  .shortmanning-box { background: #fff3cd; border: 1.5px solid #C8A84B; border-radius: 8px; padding: 14px; margin-bottom: 18px; text-align: center; }
  .shortmanning-box .label { font-size: 12px; color: #888; }
  .shortmanning-box .value { font-size: 28px; font-weight: bold; color: #0D1B4B; }
  .shortmanning-box.ok { background: #d4edda; border-color: #28a745; }
  .shortmanning-box.ok .value { color: #155724; }
  .shortmanning-box.bad { background: #f8d7da; border-color: #dc3545; }
  .shortmanning-box.bad .value { color: #721c24; }
  .submit-btn { width: 100%; padding: 16px; background: #0D1B4B; color: #C8A84B; border: none; border-radius: 10px; font-size: 17px; font-weight: bold; cursor: pointer; letter-spacing: 1px; margin-top: 8px; }
  .submit-btn:active { opacity: 0.85; transform: scale(0.99); }
  .success { display: none; text-align: center; background: #fff; border-radius: 12px; margin: 20px 16px; padding: 40px 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.08); }
  .success .tick { font-size: 60px; color: #28a745; }
  .success h2 { color: #0D1B4B; margin: 12px 0 8px; font-size: 20px; }
  .success p { color: #555; font-size: 14px; }
  .success .loc-confirm { font-weight: bold; color: #C8A84B; }
  .footer { text-align: center; padding: 16px; font-size: 11px; color: #aaa; }
  .timestamp { font-size: 11px; color: #aaa; text-align: center; margin-bottom: 6px; }
</style>
</head>
<body>

<div class="header">
  <h1>&#9670; HALOGEN GROUP</h1>
  <p>Daily Situation Report Submission</p>
</div>

<div class="location-badge">
  <div class="loc" id="loc-name">Loading...</div>
  <div class="meta" id="loc-meta"></div>
</div>

<div id="form-area">
  <div class="form-card">
    <h2>Guard Information</h2>
    <div class="field">
      <label for="guard-name">Your Full Name *</label>
      <input type="text" id="guard-name" placeholder="Enter your full name" autocomplete="name">
    </div>
    <div class="field">
      <label for="guard-rank">Rank / Role</label>
      <select id="guard-rank">
        <option value="">Select rank</option>
        <option>Guard</option>
        <option>Senior Guard</option>
        <option>Supervisor</option>
        <option>Shift Commander</option>
        <option>Team Lead</option>
      </select>
    </div>
  </div>

  <div class="form-card">
    <h2>Strength Report</h2>
    <div class="num-row">
      <div class="field">
        <label for="expected">Expected Guards *</label>
        <input type="number" id="expected" min="0" placeholder="0" oninput="calcShort()">
      </div>
      <div class="field">
        <label for="actual">Actual Guards *</label>
        <input type="number" id="actual" min="0" placeholder="0" oninput="calcShort()">
      </div>
    </div>
    <div class="shortmanning-box" id="short-box">
      <div class="label">Short-manning</div>
      <div class="value" id="short-val">—</div>
    </div>
    <div class="field">
      <label for="incident">Incident / Remarks (optional)</label>
      <textarea id="incident" rows="3" placeholder="Report any incidents, issues, or notes for today..."></textarea>
    </div>
  </div>

  <div style="margin: 0 16px 8px;">
    <div class="timestamp" id="ts"></div>
    <button class="submit-btn" onclick="submitForm()">&#10003; SUBMIT SITREP</button>
  </div>
</div>

<div class="success" id="success-area">
  <div class="tick">&#10003;</div>
  <h2>Sitrep Submitted!</h2>
  <p>Report for <span class="loc-confirm" id="success-loc"></span> has been recorded.</p>
  <p style="margin-top:8px;">Time: <strong id="success-time"></strong></p>
  <p style="margin-top:16px;font-size:12px;color:#aaa;">You may close this page.</p>
</div>

<div class="footer">Halogen Group Security &bull; Confidential</div>

<script>
const params = new URLSearchParams(window.location.search);
const location = params.get('location') || 'UNKNOWN LOCATION';
const callsign = params.get('callsign') || '';
const region = params.get('region') || '';
const zone = params.get('zone') || '';
const tsl = params.get('tsl') || '';

document.getElementById('loc-name').textContent = location;
document.getElementById('loc-meta').textContent = [region, zone, 'TSL: ' + tsl, 'Call Sign: ' + callsign].filter(Boolean).join('  •  ');
document.getElementById('success-loc').textContent = location;

function updateTimestamp() {
  const now = new Date();
  document.getElementById('ts').textContent = 'Submission time: ' + now.toLocaleString('en-GB', {weekday:'long', day:'numeric', month:'long', year:'numeric', hour:'2-digit', minute:'2-digit'});
}
updateTimestamp();
setInterval(updateTimestamp, 30000);

function calcShort() {
  const e = parseInt(document.getElementById('expected').value) || 0;
  const a = parseInt(document.getElementById('actual').value) || 0;
  const box = document.getElementById('short-box');
  const val = document.getElementById('short-val');
  if (!document.getElementById('expected').value || !document.getElementById('actual').value) {
    val.textContent = '—'; box.className = 'shortmanning-box'; return;
  }
  const diff = e - a;
  val.textContent = diff === 0 ? 'Full strength' : diff > 0 ? diff + ' short' : Math.abs(diff) + ' extra';
  box.className = 'shortmanning-box ' + (diff > 0 ? 'bad' : 'ok');
}

function submitForm() {
  const name = document.getElementById('guard-name').value.trim();
  const expected = document.getElementById('expected').value;
  const actual = document.getElementById('actual').value;
  if (!name) { alert('Please enter your full name.'); return; }
  if (!expected || !actual) { alert('Please fill in both Expected and Actual guards.'); return; }

  // In a real deployment, this would POST to your backend/Google Sheets API
  const payload = {
    location, callsign, region, zone, tsl,
    guardName: name,
    rank: document.getElementById('guard-rank').value,
    expected: parseInt(expected),
    actual: parseInt(actual),
    shortmanning: parseInt(expected) - parseInt(actual),
    incident: document.getElementById('incident').value,
    submittedAt: new Date().toISOString()
  };
  console.log('SITREP PAYLOAD:', JSON.stringify(payload, null, 2));

  document.getElementById('form-area').style.display = 'none';
  document.getElementById('success-area').style.display = 'block';
  document.getElementById('success-time').textContent = new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
}
</script>
</body>
</html>
