<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Arial, sans-serif; background: #f0f0f0; color: #111; }
  .top-bar { background: #0D1B4B; color: #C8A84B; padding: 18px 32px; display: flex; align-items: center; gap: 20px; }
  .top-bar h1 { font-size: 20px; font-weight: bold; letter-spacing: 1px; }
  .top-bar p { font-size: 13px; color: #ddd; margin-top: 4px; }
  .controls { background: #fff; padding: 16px 32px; border-bottom: 1px solid #ddd; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .controls input { padding: 8px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; width: 260px; }
  .controls select { padding: 8px 14px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
  .controls button { padding: 8px 18px; background: #C8A84B; color: #0D1B4B; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 14px; }
  .controls button:hover { background: #a88b3a; }
  .grid { display: flex; flex-wrap: wrap; gap: 20px; padding: 24px 32px; }
  .card { background: #fff; border-radius: 10px; padding: 20px 16px 16px; width: 260px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); display: flex; flex-direction: column; align-items: center; border-top: 4px solid #C8A84B; page-break-inside: avoid; }
  .card .callsign { background: #0D1B4B; color: #C8A84B; font-size: 11px; font-weight: bold; padding: 2px 10px; border-radius: 20px; margin-bottom: 10px; letter-spacing: 1px; }
  .card .loc-name { font-size: 13px; font-weight: bold; color: #0D1B4B; text-align: center; margin-bottom: 4px; min-height: 34px; display: flex; align-items: center; justify-content: center; }
  .card .meta { font-size: 11px; color: #777; margin-bottom: 12px; text-align: center; }
  .card .qr-box { width: 180px; height: 180px; display: flex; align-items: center; justify-content: center; }
  .card .qr-box canvas, .card .qr-box img { width: 180px !important; height: 180px !important; }
  .card .footer { font-size: 10px; color: #aaa; margin-top: 10px; text-align: center; }
  .count { font-size: 13px; color: #555; margin-left: auto; }
  @media print {
    body { background: white; }
    .controls, .top-bar { display: none; }
    .grid { padding: 0; gap: 12px; }
    .card { box-shadow: none; border: 1px solid #ddd; width: 230px; }
  }
</style>

</div>

    <option value="EAST 1">EAST 1</option>
    <option value="EAST 2">EAST 2</option>
  </select>
  <select id="zoneFilter" onchange="filterCards()">

    <option value="ZONE A">ZONE A</option>
    <option value="ZONE B">ZONE B</option>
    <option value="ZONE C">ZONE C</option>

  <button onclick="window.print()">&#128438; Print All</button>
  <span class="count" id="count-label"></span>

const cards = [];

function buildForm(loc) {
  const params = new URLSearchParams({
    location: loc.location,
    callsign: loc.callsign,
    region: loc.region,
    zone: loc.zone,
    tsl: loc.tsl
  });
  return BASE_URL + '?' + params.toString();
}

function makeCard(loc, idx) {
  const url = buildForm(loc);
  const div = document.createElement('div');
  div.className = 'card';
  div.dataset.location = loc.location.toLowerCase();
  div.dataset.callsign = loc.callsign.toLowerCase();
  div.dataset.region = loc.region;
  div.dataset.zone = loc.zone;

  div.innerHTML = `
    <span class="callsign">${loc.callsign}</span>
    <div class="loc-name">${loc.location}</div>
    <div class="meta">${loc.region} &bull; ${loc.zone} &bull; TSL: ${loc.tsl}</div>
    <div class="qr-box" id="qr-${idx}"></div>
    <div class="footer">Scan to submit daily sitrep</div>
  `;

  document.getElementById('grid').appendChild(div);

  new QRCode(document.getElementById('qr-' + idx), {
    text: url,
    width: 180,
    height: 180,
    colorDark: "#0D1B4B",
    colorLight: "#ffffff",
    correctLevel: QRCode.CorrectLevel.M
  });

  cards.push(div);
}

function filterCards() {
  const q = document.getElementById('search').value.toLowerCase();
  const region = document.getElementById('regionFilter').value;
  const zone = document.getElementById('zoneFilter').value;
  let visible = 0;
  cards.forEach(card => {
    const matchQ = !q || card.dataset.location.includes(q) || card.dataset.callsign.includes(q);
    const matchR = !region || card.dataset.region === region;
    const matchZ = !zone || card.dataset.zone === zone;
    const show = matchQ && matchR && matchZ;
    card.style.display = show ? '' : 'none';
    if (show) visible++;
  });
  document.getElementById('count-label').textContent = visible + ' locations shown';
}

locations.forEach((loc, idx) => makeCard(loc, idx));
document.getElementById('count-label').textContent = locations.length + ' locations shown';
</script>
